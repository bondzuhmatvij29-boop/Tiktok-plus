<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Plus</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #151922;
      --surface-2: #1e2430;
      --text: #f3f5f8;
      --muted: #8f98a8;
      --accent: #ff2b55;
      --accent-2: #25f4ee;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 13, 18, 0.88);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #090b0f;
      font-weight: 700;
    }

    main {
      flex: 1;
      padding: 14px 16px 84px;
    }

    .page {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .page.active {
      display: flex;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .video-box {
      background: linear-gradient(145deg, #1b2232, #11151f);
      border-radius: 12px;
      height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .video-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .video-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .video-author {
      font-size: 13px;
      color: var(--accent-2);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-2);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }

    button.liked {
      background: rgba(255, 43, 85, 0.2);
      color: #ff6b88;
      border: 1px solid rgba(255, 43, 85, 0.45);
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(15, 19, 28, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px;
      z-index: 20;
    }

    .nav-btn {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 2px;
      font-size: 11px;
      color: var(--muted);
      border-radius: 8px;
    }

    .nav-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-row {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .stat-row strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span>TikTok Plus</span>
        <span class="badge">PLUS</span>
      </div>
      <span class="muted" id="header-status">Головна</span>
    </header>

    <main>
      <!-- Головна -->
      <section class="page active" id="page-home">
        <div id="feed-list"></div>
      </section>

      <!-- Пошук -->
      <section class="page" id="page-search">
        <div class="card">
          <h3 style="margin-bottom: 10px;">Пошук відео та авторів</h3>
          <input type="text" id="search-input" placeholder="Введіть назву або @автор..." />
          <div id="search-results"></div>
        </div>
      </section>

      <!-- Завантаження -->
      <section class="page" id="page-upload">
        <div class="card">
          <h3 style="margin-bottom: 10px;">Додати пост у стрічку</h3>
          <input type="text" id="upload-title" placeholder="Назва або опис ролика" />
          <input type="text" id="upload-author" placeholder="Ваш нік (наприклад, @user)" value="@creator" />
          <button class="primary" id="upload-btn" style="width: 100%;">Опублікувати</button>
          <p class="muted" id="upload-msg" style="margin-top: 8px;"></p>
        </div>
      </section>

      <!-- Повідомлення -->
      <section class="page" id="page-messages">
        <div class="card">
          <h3 style="margin-bottom: 10px;">Повідомлення</h3>
          <div id="chat-box" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
            <div class="card" style="padding: 10px; background: var(--surface-2);">
              <strong>@system</strong>
              <p class="muted">Ласкаво просимо в TikTok Plus!</p>
            </div>
          </div>
          <input type="text" id="chat-input" placeholder="Написати повідомлення..." />
          <button class="primary" id="chat-send" style="width: 100%;">Надіслати</button>
        </div>
      </section>

      <!-- Профіль -->
      <section class="page" id="page-profile">
        <div class="card">
          <h3>@creator</h3>
          <p class="muted" style="margin-top: 4px;">Клієнтський прототип інтерфейсу</p>
          <div class="stat-row">
            <div><strong id="stat-posts">0</strong> відео</div>
            <div><strong id="stat-likes">0</strong> вподобань</div>
          </div>
        </div>
      </section>
    </main>

    <nav class="nav">
      <button class="nav-btn active" data-page="home" data-title="Головна">🏠<span>Головна</span></button>
      <button class="nav-btn" data-page="search" data-title="Пошук">🔍<span>Пошук</span></button>
      <button class="nav-btn" data-page="upload" data-title="Завантажити">➕<span>Додати</span></button>
      <button class="nav-btn" data-page="messages" data-title="Чат">💬<span>Чат</span></button>
      <button class="nav-btn" data-page="profile" data-title="Профіль">👤<span>Профіль</span></button>
    </nav>
  </div>

  <script>
    const state = {
      videos: [
        { id: 1, title: "Швидкий розбір інтерфейсу та анімацій", author: "@dev_notes", likes: 128, liked: false, views: "4.2K" },
        { id: 2, title: "Тест продуктивності в браузері", author: "@ui_lab", likes: 84, liked: false, views: "1.9K" }
      ]
    };

    const feedList = document.getElementById("feed-list");
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");

    function updateStats() {
      document.getElementById("stat-posts").textContent = state.videos.length;
      const totalLikes = state.videos.reduce((acc, v) => acc + v.likes, 0);
      document.getElementById("stat-likes").textContent = totalLikes;
    }

    function renderFeed() {
      feedList.innerHTML = "";
      state.videos.forEach((v) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="video-box">
            <div class="video-top">
              <span>▶ Прев'ю ролика #${v.id}</span>
              <span>👁 ${v.views}</span>
            </div>
            <div>
              <div class="video-title">${escapeHtml(v.title)}</div>
              <div class="video-author">${escapeHtml(v.author)}</div>
            </div>
          </div>
          <div class="actions">
            <button class="${v.liked ? "liked" : ""}" onclick="toggleLike(${v.id})">
              ${v.liked ? "❤️" : "🤍"} ${v.likes}
            </button>
            <button onclick="copyShare('${escapeHtml(v.title)}')">🔗 Поділитися</button>
          </div>
        `;
        feedList.appendChild(card);
      });
      updateStats();
      renderSearch();
    }

    function toggleLike(id) {
      const item = state.videos.find((v) => v.id === id);
      if (!item) return;
      item.liked = !item.liked;
      item.likes += item.liked ? 1 : -1;
      renderFeed();
    }

    function copyShare(title) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(title).catch(() => {});
      }
      alert("Скопійовано: " + title);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Навігація
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.dataset.page;
        document.getElementById("header-status").textContent = btn.dataset.title;
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + target).classList.add("active");
      });
    });

    // Пошук
    function renderSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const matches = state.videos.filter(
        (v) => !q || v.title.toLowerCase().includes(q) || v.author.toLowerCase().includes(q)
      );
      searchResults.innerHTML = matches.length
        ? matches
            .map(
              (m) => `
              <div class="card" style="padding: 10px; margin-bottom: 8px; background: var(--surface-2);">
                <strong>${escapeHtml(m.title)}</strong>
                <div class="muted">${escapeHtml(m.author)} · ❤️ ${m.likes}</div>
              </div>
            `
            )
            .join("")
        : `<p class="muted">Нічого не знайдено.</p>`;
    }
    searchInput.addEventListener("input", renderSearch);

    // Завантаження нового поста
    document.getElementById("upload-btn").addEventListener("click", () => {
      const titleEl = document.getElementById("upload-title");
      const authorEl = document.getElementById("upload-author");
      const title = titleEl.value.trim();
      const author = authorEl.value.trim() || "@creator";
      if (!title) {
        document.getElementById("upload-msg").textContent = "Введіть назву ролика.";
        return;
      }
      state.videos.unshift({
        id: Date.now(),
        title,
        author,
        likes: 0,
        liked: false,
        views: "1"
      });
      titleEl.value = "";
      document.getElementById("upload-msg").textContent = "Додано у стрічку!";
      renderFeed();
    });

    // Чат
    document.getElementById("chat-send").addEventListener("click", () => {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      const box = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = "card";
      msg.style.padding = "10px";
      msg.style.background = "var(--surface-2)";
      msg.innerHTML = `<strong>Ви</strong><p style="margin-top: 2px;">${escapeHtml(text)}</p>`;
      box.appendChild(msg);
      input.value = "";
    });

    renderFeed();
  </script>
</body>
</html>
